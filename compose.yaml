services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RESPIRE_DATABASE_USER:-respire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESPIRE_DATABASE_NAME:-respire}
    volumes:
      - respire-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    image: ${ONEMEMORY_SERVER_IMAGE:-ghcr.io/risense-ai/respire-server:1.0.0}
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ONEMEMORY_HOST_BIND:-127.0.0.1}:${ONEMEMORY_HOST_PORT:-8787}:8787"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${RESPIRE_DATABASE_USER:-respire}:${POSTGRES_PASSWORD}@db:5432/${RESPIRE_DATABASE_NAME:-respire}}
      RESPIRE_CORS_ALLOWED_ORIGINS: ${RESPIRE_CORS_ALLOWED_ORIGINS:-}
      RESPIRE_DASHBOARD_URL: ${RESPIRE_DASHBOARD_URL:-https://dash.rsrs.rs}
      RESPIRE_GITHUB_CLIENT_ID: ${RESPIRE_GITHUB_CLIENT_ID:-}
      RESPIRE_GITHUB_CLIENT_SECRET: ${RESPIRE_GITHUB_CLIENT_SECRET:-}
      RESPIRE_GITHUB_REDIRECT_URI: ${RESPIRE_GITHUB_REDIRECT_URI:-}
      ONEMEMORY_ADMIN_TOKEN: ${ONEMEMORY_ADMIN_TOKEN:-}
      RESPIRE_SMTP_HOST: ${RESPIRE_SMTP_HOST:-}
      RESPIRE_SMTP_PORT: ${RESPIRE_SMTP_PORT:-587}
      RESPIRE_SMTP_USERNAME: ${RESPIRE_SMTP_USERNAME:-}
      RESPIRE_SMTP_PASSWORD: ${RESPIRE_SMTP_PASSWORD:-}
      RESPIRE_MAIL_FROM: ${RESPIRE_MAIL_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  respire-pg:
