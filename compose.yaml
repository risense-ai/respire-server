services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RSRS_DATABASE_USER-${ONEMEMORY_DATABASE_USER-${RESPIRE_DATABASE_USER-respire}}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${RSRS_DATABASE_NAME-${ONEMEMORY_DATABASE_NAME-${RESPIRE_DATABASE_NAME-respire}}}
    volumes:
      - respire-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    image: ${RSRS_SERVER_IMAGE-${ONEMEMORY_SERVER_IMAGE-${RESPIRE_SERVER_IMAGE-ghcr.io/risense-ai/respire-server:1.0.0}}}
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RSRS_HOST_BIND-${ONEMEMORY_HOST_BIND-${RESPIRE_HOST_BIND-127.0.0.1}}}:${RSRS_HOST_PORT-${ONEMEMORY_HOST_PORT-${RESPIRE_HOST_PORT-8787}}}:8787"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${RSRS_DATABASE_USER-${ONEMEMORY_DATABASE_USER-${RESPIRE_DATABASE_USER-respire}}}:${POSTGRES_PASSWORD}@db:5432/${RSRS_DATABASE_NAME-${ONEMEMORY_DATABASE_NAME-${RESPIRE_DATABASE_NAME-respire}}}}
      RSRS_CORS_ALLOWED_ORIGINS: ${RSRS_CORS_ALLOWED_ORIGINS-${ONEMEMORY_CORS_ALLOWED_ORIGINS-${RESPIRE_CORS_ALLOWED_ORIGINS-}}}
      RSRS_DASHBOARD_URL: ${RSRS_DASHBOARD_URL-${ONEMEMORY_DASHBOARD_URL-${RESPIRE_DASHBOARD_URL-https://dash.rsrs.rs}}}
      RSRS_GITHUB_CLIENT_ID: ${RSRS_GITHUB_CLIENT_ID-${ONEMEMORY_GITHUB_CLIENT_ID-${RESPIRE_GITHUB_CLIENT_ID-}}}
      RSRS_GITHUB_CLIENT_SECRET: ${RSRS_GITHUB_CLIENT_SECRET-${ONEMEMORY_GITHUB_CLIENT_SECRET-${RESPIRE_GITHUB_CLIENT_SECRET-}}}
      RSRS_GITHUB_REDIRECT_URI: ${RSRS_GITHUB_REDIRECT_URI-${ONEMEMORY_GITHUB_REDIRECT_URI-${RESPIRE_GITHUB_REDIRECT_URI-}}}
      RSRS_ADMIN_TOKEN: ${RSRS_ADMIN_TOKEN-${ONEMEMORY_ADMIN_TOKEN-${RESPIRE_ADMIN_TOKEN-}}}
      RSRS_SMTP_HOST: ${RSRS_SMTP_HOST-${ONEMEMORY_SMTP_HOST-${RESPIRE_SMTP_HOST-}}}
      RSRS_SMTP_PORT: ${RSRS_SMTP_PORT-${ONEMEMORY_SMTP_PORT-${RESPIRE_SMTP_PORT-587}}}
      RSRS_SMTP_USERNAME: ${RSRS_SMTP_USERNAME-${ONEMEMORY_SMTP_USERNAME-${RESPIRE_SMTP_USERNAME-}}}
      RSRS_SMTP_PASSWORD: ${RSRS_SMTP_PASSWORD-${ONEMEMORY_SMTP_PASSWORD-${RESPIRE_SMTP_PASSWORD-}}}
      RSRS_MAIL_FROM: ${RSRS_MAIL_FROM-${ONEMEMORY_MAIL_FROM-${RESPIRE_MAIL_FROM-}}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  respire-pg:
