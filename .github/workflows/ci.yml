name: Server CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    env:
      RESPIRE_CORE_TEST_MODE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned binary Core SDK
        run: node scripts/fetch-core-sdk.mjs x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo check --workspace --locked
      - name: OpenAPI contract present
        run: test -s service/openapi.yaml

  test:
    name: unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESPIRE_CORE_TEST_MODE: '1'
      RUST_TEST_THREADS: '1'
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned binary Core SDK
        run: node scripts/fetch-core-sdk.mjs x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: cargo test
        run: cargo test --locked -p respire_service -- --test-threads=4
      - name: line coverage ≥ 90% (http/store/totp)
        run: |
          cargo llvm-cov --locked -p respire_service --fail-under-lines 90 \
            --ignore-filename-regex '(bound\.rs|web\.rs|access\.rs|main\.rs|admin\.html)'
