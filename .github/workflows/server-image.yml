# Server image pipeline.
# Build, test and smoke checks run in isolated Docker containers on hosted runners.
# Smoke checks use a separate Compose project and a dynamic port.
name: Server image

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the validated image to the private package registry
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  service-check:
    name: service tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Legacy vault login verifies native credential persistence. Docker's
    # keyctl restrictions do not satisfy that contract; run the unchanged
    # complete test suite on the host with an isolated PostgreSQL service.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RSRS_CORE_TEST_MODE: '1'
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned binary Core SDK
        run: node scripts/fetch-core-sdk.mjs x86_64-unknown-linux-gnu
      - name: Run complete service tests with isolated PostgreSQL
        run: cargo test --locked -p respire_service -- --test-threads=4

  image:
    name: docker image
    needs: service-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          clean: false
      - name: Clean previous container build output
        run: docker run --rm -v "$PWD":/w alpine:3.20 sh -c 'rm -rf /w/target /w/ci-out'

      - name: Read the service version
        run: |
          set -euo pipefail
          SERVICE_VERSION="$(awk -F'"' '/^version/{print $2; exit}' service/Cargo.toml)"
          echo "SERVICE_VERSION=${SERVICE_VERSION}" >> "${GITHUB_ENV}"

      - name: Require a matching version tag for requested publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != tag || "$REF_NAME" != "v${SERVICE_VERSION}" ]]; then
            echo "::error::Select the v${SERVICE_VERSION} tag to publish; main builds do not publish."
            exit 1
          fi

      - name: Build the image in Docker
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          docker build -f service/Dockerfile --build-arg "RSRS_BUILD_REVISION=$GITHUB_SHA" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "respire-server:ci-${GITHUB_RUN_ID}" -t "ghcr.io/risense-ai/respire-server:ci-${GITHUB_RUN_ID}" .

      - name: Compose smoke checks for health and persistent storage
        env:
          RSRS_SERVER_IMAGE: respire-server:ci-${{ github.run_id }}
          RSRS_HOST_BIND: 127.0.0.1
          RSRS_HOST_PORT: "0"
          RSRS_ADMIN_TOKEN: ci-smoke-token-not-a-secret
          POSTGRES_PASSWORD: ci-smoke-pg
          RSRS_CORS_ALLOWED_ORIGINS: https://dashboard.ci.invalid,https://admin.ci.invalid
        run: |
          set -euo pipefail
          COMPOSE=(docker compose --project-name "respire-ci-${GITHUB_RUN_ID}" -f compose.yaml)
          cleanup() {
            "${COMPOSE[@]}" down -v --remove-orphans || true
          }
          trap cleanup EXIT
          wait_health() {
            local msg="$1"
            local ok=0
            for _ in $(seq 1 30); do
              if curl -fsS "$BASE/health" | grep -q '"ok"'; then
                ok=1
                break
              fi
              sleep 2
            done
            [ "${ok}" = "1" ] || { echo "::error::${msg}"; "${COMPOSE[@]}" logs; exit 1; }
          }
          "${COMPOSE[@]}" up -d --no-build
          BASE="http://$("${COMPOSE[@]}" port server 8787)"
          wait_health "/health did not become ready before the timeout"
          curl -fsS "$BASE/health" | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["source_revision"] == os.environ["GITHUB_SHA"]'
          # Check the real packaged API and Compose environment wiring before Pages.
          for origin in https://dashboard.ci.invalid https://admin.ci.invalid; do
            status=$(curl -sS -D /tmp/cors-headers -o /tmp/cors-body -w '%{http_code}' \
              -X OPTIONS -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type' "$BASE/login")
            test "$status" = 204
            tr -d '\r' < /tmp/cors-headers | grep -qi "^access-control-allow-origin: $origin$"
            tr -d '\r' < /tmp/cors-headers | grep -qi '^vary: Origin$'
            status=$(curl -sS -D /tmp/cors-headers -o /tmp/cors-body -w '%{http_code}' \
              -H "Origin: $origin" "$BASE/api/self")
            test "$status" = 401
            tr -d '\r' < /tmp/cors-headers | grep -qi "^access-control-allow-origin: $origin$"
            ! grep -qi '^access-control-allow-credentials:' /tmp/cors-headers
          done
          status=$(curl -sS -D /tmp/cors-headers -o /tmp/cors-body -w '%{http_code}' \
            -X OPTIONS -H 'Origin: https://untrusted.ci.invalid' \
            -H 'Access-Control-Request-Method: POST' "$BASE/login")
          test "$status" = 403
          ! grep -qi '^access-control-allow-origin:' /tmp/cors-headers
          python3 service/sync_probe.py --url "$BASE" --user sync-ci-probe
          schema_version="$("${COMPOSE[@]}" exec -T db psql -U respire -d respire -tAc "SELECT v FROM schema_meta WHERE k='version'")"
          test "$schema_version" = 7 || { echo "::error::expected cloud schema 7 after operations stats migration, got $schema_version"; exit 1; }
          github_tables="$("${COMPOSE[@]}" exec -T db psql -U respire -d respire -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('github_identities','github_authorizations')")"
          test "$github_tables" = 2 || { echo "::error::GitHub migration tables missing"; exit 1; }
          stats_table="$("${COMPOSE[@]}" exec -T db psql -U respire -d respire -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='ops_daily_stats'")"
          test "$stats_table" = 1 || { echo "::error::operations stats migration missing"; exit 1; }
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"user":"ci-smoke","pass_hash":"ab","salt":"cd"}' \
            "$BASE/register"
          "${COMPOSE[@]}" down --remove-orphans
          "${COMPOSE[@]}" up -d --no-build
          BASE="http://$("${COMPOSE[@]}" port server 8787)"
          wait_health "/health failed after recreating the container"
          login="$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"user":"ci-smoke","pass_hash":"ab"}' \
            "$BASE/login")"
          echo "${login}" | grep -q '"token"' || { echo "::error::named volume was unavailable after recreating the container: ${login}"; exit 1; }
          "${COMPOSE[@]}" exec -T db psql -U respire -d respire -tAc "SELECT COUNT(*) FROM users WHERE \"user\"='ci-smoke'" | grep -q 1

      - name: Check that the tag matches the service version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "${TAG}" in
            "v${SERVICE_VERSION}") ;;
            v*)
              echo "::error::tag ${TAG} does not match service/Cargo.toml version ${SERVICE_VERSION} (expected v${SERVICE_VERSION})"
              exit 1
              ;;
            *)
              echo "::error::Publish only v-prefixed tags matching service/Cargo.toml"
              exit 1
              ;;
          esac

      - name: Require successful CI for the exact version before publication
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 20 --json status,conclusion)"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo '::error::The exact source revision failed Server CI'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for Server CI; image remains unpublished'
          exit 1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="$SERVICE_VERSION"
            CHANNEL=latest
          else
            VERSION="${SERVICE_VERSION}-dev.${GITHUB_RUN_ID}"
            CHANNEL=dev
          fi
          docker tag "ghcr.io/risense-ai/respire-server:ci-${GITHUB_RUN_ID}" \
            "ghcr.io/risense-ai/respire-server:${VERSION}"
          docker tag "ghcr.io/risense-ai/respire-server:ci-${GITHUB_RUN_ID}" \
            "ghcr.io/risense-ai/respire-server:sha-${GITHUB_SHA}"
          docker tag "ghcr.io/risense-ai/respire-server:ci-${GITHUB_RUN_ID}" \
            "ghcr.io/risense-ai/respire-server:${CHANNEL}"
          docker push "ghcr.io/risense-ai/respire-server:${VERSION}"
          docker push "ghcr.io/risense-ai/respire-server:sha-${GITHUB_SHA}"
          docker push "ghcr.io/risense-ai/respire-server:${CHANNEL}"

      - name: Clean CI containers and temporary image tags
        if: always()
        env:
          POSTGRES_PASSWORD: ci-smoke-pg
        run: |
          docker compose --project-name "respire-ci-${GITHUB_RUN_ID}" -f compose.yaml down -v --remove-orphans || true
          docker rm -f "respire-ci-test-${GITHUB_RUN_ID}" || true
          docker image rm "respire-server:ci-${GITHUB_RUN_ID}" "ghcr.io/risense-ai/respire-server:ci-${GITHUB_RUN_ID}" || true
