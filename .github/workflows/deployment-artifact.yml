name: Deployment artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: respire-deployment-artifact
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require successful CI for the exact server revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml server-image.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --event push --limit 20 --json conclusion,status | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: risense-ai/respire-site
          ref: main
          path: .site-src
          persist-credentials: false
      - name: Record the exact site revision and require its CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifact
          printf '%s\n' "$GITHUB_SHA" > artifact/server-sha.txt
          git -C .site-src rev-parse HEAD > artifact/site-sha.txt
          SITE_SHA="$(cat artifact/site-sha.txt)"
          gh run list --repo risense-ai/respire-site --workflow ci.yml --commit "$SITE_SHA" --branch main --event push --limit 20 --json conclusion,status | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and package deployment images
        run: |
          set -euo pipefail
          cp -a .site-src/homepage homepage
          rm -rf homepage/node_modules homepage/prototypes
          (cd homepage && npm ci && npm test && npm run build)
          (cd admin-ui && npm ci && npm test && npm run build)
          docker build -f service/Dockerfile -t "respire-server:${GITHUB_SHA}" .
          docker build -f deploy/web/Dockerfile -t "respire-web:${GITHUB_SHA}" .
          docker save "respire-server:${GITHUB_SHA}" "respire-web:${GITHUB_SHA}" | gzip > artifact/images.tar.gz
          cp compose.yaml deploy/compose-web.yaml deploy/ssh-deploy.sh artifact/
          (cd artifact && sha256sum images.tar.gz server-sha.txt site-sha.txt compose.yaml compose-web.yaml ssh-deploy.sh > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: artifact/
          retention-days: 7
