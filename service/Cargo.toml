[package]
name = "respire_service"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "respire cloud service — ciphertext store, auth domain, and loopback APIs"
license-file = "../LICENSE"
repository = "https://github.com/risense-ai/respire-server"

[[bin]]
name = "respire-server"
path = "src/main.rs"

[dependencies]
respire = { package = "respire_app", git = "https://github.com/risense-ai/respire-cli.git", rev = "09c2c4acd8e0e2dc178442345dd0446386f73d5f" }
anyhow = "1.0"
bytes = "1"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
postgres = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
tiny_http = "0.12"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.0", features = ["v4"] }
url = "2.5"
ureq = { version = "2.12.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.15"
keyring = "3"

[lints.rust]
unsafe_code = "forbid"
