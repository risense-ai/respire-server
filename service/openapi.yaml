openapi: 3.0.3
info:
  title: Respire sync server
  version: 1.0.0
  description: >
    Ciphertext store plus auth. The server never decrypts payloads.
    CLI and other clients talk to these paths. This is a partial sync/self API
    schema; Admin JSON routes are not yet fully described. Frontends are owned by
    respire-site. See ../docs/browser-api-contract.md for the cross-origin
    GET/POST + Authorization/Content-Type contract and staged rollout.
servers:
  - url: https://api.rsrs.rs
    description: Assigned Respire API endpoint; configuration only, not proof of DNS or deployment.
  - url: http://127.0.0.1:8787
    description: Local development server.
paths:
  /admin/stats:
    get:
      summary: Anonymous daily insert totals in Asia/Shanghai (owner or admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        "200":
          description: Memory counts start at schema 7; historical registrations/sessions cover retained records at upgrade. Later deletion never reduces these event totals.
          content:
            application/json:
              schema:
                type: object
                required: [days, timezone, memory_tracking_since, historical_baseline, series]
                properties:
                  days: { type: integer }
                  timezone: { type: string, enum: [Asia/Shanghai] }
                  memory_tracking_since: { type: string, format: date }
                  historical_baseline: { type: string, enum: [retained_registrations_and_sessions] }
                  series:
                    type: array
                    items:
                      type: object
                      required: [date, registrations, memories, sessions]
                      properties:
                        date: { type: string, format: date }
                        registrations: { type: integer, minimum: 0 }
                        memories: { type: integer, minimum: 0, nullable: true, description: First live blob inserted on the server; null before tracking started. }
                        sessions: { type: integer, minimum: 0 }
        "400": { description: days is not an integer in 7–90 }
        "401": { description: Missing or invalid admin credentials }
        "403": { description: Viewer cannot read operations statistics }
        "503": { description: Database unavailable }
  /oauth/github/start:
    post:
      summary: Start ten-minute GitHub authorization with PKCE
      responses:
        "200":
          description: Browser must save and compare state, expiry and its original hash route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GithubStart' }
        "503": { description: GitHub is not configured }
  /oauth/github/exchange:
    post:
      summary: Consume a GitHub grant and sign in or register by immutable GitHub ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GithubExchange' }
      responses:
        "200": { description: User session or totp_required ticket. Vault recovery stays local. }
        "400": { description: Invalid, expired or replayed state }
        "409": { description: Disabled/deleted account or name conflict; never merge accounts }
        "502": { description: GitHub denied or exchange failed; restart authorization }
  /api/self/github:
    get:
      summary: Read your GitHub binding status
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: bound with optional numeric id and current login }
  /api/self/github/start:
    post:
      summary: Start owner-bound GitHub linking
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ten-minute owner-bound browser grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GithubStart' }
        "403": { description: Readonly session }
        "503": { description: GitHub is not configured }
  /api/self/github/exchange:
    post:
      summary: Consume your grant and link an unbound GitHub identity
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GithubExchange' }
      responses:
        "200": { description: bound, numeric id and login; session is unchanged }
        "400": { description: Invalid, expired, replayed or wrong-owner grant }
        "409": { description: Either identity is already bound }
        "502": { description: GitHub exchange failed }
  /api/self/github/unbind:
    post:
      summary: Unlink GitHub without signing out or changing encrypted data
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: bound is false; existing sessions remain valid }
        "409": { description: Set a login password before removing the sole login method }
  /api/self/github/vault:
    post:
      summary: Initialize a GitHub account's version-4 vault exactly once
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kdf_salt, wrapped_urk, urk_nonce, version]
              properties:
                kdf_salt: { type: string, pattern: '^[0-9a-fA-F]{32}$' }
                wrapped_urk: { type: string, pattern: '^[0-9a-fA-F]{96}$' }
                urk_nonce: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
                version: { type: integer, enum: [4] }
      responses:
        "200": { description: Initial vault stored; no plaintext recovery code accepted }
        "400": { description: Invalid wrapped vault }
        "409": { description: Preserve existing vault/memories or account is unavailable }
  /oauth/device/code:
    post:
      summary: Start OAuth device authorization for the public Respire CLI
      description: RFC 8628 device grant. The dashboard origin comes from RSRS_DASHBOARD_URL, defaulting to https://dash.rsrs.rs. Development deployments must set their own dashboard origin.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, enum: [respire-cli] }
                device_name: { type: string, maxLength: 128, default: CLI }
                expected_user: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Ten-minute, single-use grant. Display and compare user_code before approving in the dashboard. Keep device_code private.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code: { type: string }
                  user_code: { type: string, pattern: '^[A-F0-9]{12}$' }
                  verification_uri: { type: string, format: uri }
                  verification_uri_complete: { type: string, format: uri }
                  expires_in: { type: integer, enum: [600] }
                  interval: { type: integer, enum: [5] }
        "400": { description: invalid_request or invalid_client }
  /oauth/token:
    post:
      summary: Exchange an approved OAuth device grant once
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, grant_type, device_code]
              properties:
                client_id: { type: string, enum: [respire-cli] }
                grant_type: { type: string, enum: ['urn:ietf:params:oauth:grant-type:device_code'] }
                device_code: { type: string }
      responses:
        "200":
          description: Normal account session, revocable through the sessions API. No refresh token is issued. Never put access_token in a browser URL.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, user, session_id]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  user: { type: string }
                  session_id: { type: string }
        "400": { description: authorization_pending, slow_down, access_denied, expired_token, invalid_grant, invalid_request, invalid_client or unsupported_grant_type. Increase the polling interval by five seconds for slow_down. }
  /api/self/cli-authorization/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Fa-f0-9]{12}$' } }
    get:
      summary: Inspect a pending CLI authorization without exposing its private device code
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Device name, expected account, remaining expiry and state }
        "404": { description: Grant expired or unavailable }
    post:
      summary: Explicitly approve or deny the CLI authorization as the signed-in account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
      responses:
        "200": { description: Decision recorded; no super password is sent to the server }
        "403": { description: Readonly sessions cannot authorize another session }
        "409": { description: Grant expired, already decided or expected a different account }
  /api/self/totp/disable:
    post:
      summary: Disable TOTP after verifying its current code, preserving existing sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        "200": { description: TOTP disabled; existing login sessions remain valid }
        "400": { description: Invalid TOTP code; binding and session remain intact }
        "401": { description: Missing or invalid session token }
  /api/self/memories:
    get:
      summary: Bounded ciphertext snapshot or incremental browser page
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: epoch, in: query, required: true, schema: { type: string } }
        - { name: after, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: until, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: snapshot, in: query, schema: { type: string, enum: ['0', '1'], default: '0' } }
      responses:
        "200":
          description: At most 100 applied records, targeting 256 KiB; one oversized record is allowed. Retain until across pages.
          content:
            application/json:
              schema:
                type: object
                required: [epoch, until, cursor, has_more, blobs]
                properties:
                  epoch: { type: string }
                  until: { type: integer, format: int64 }
                  cursor: { type: integer, format: int64 }
                  has_more: { type: boolean }
                  blobs:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, ciphertext, nonce, updated_at, deleted]
                      properties:
                        id: { type: string }
                        ciphertext: { type: string }
                        nonce: { type: string }
                        updated_at: { type: string }
                        deleted: { type: boolean }
        "400": { description: Malformed cursor or mode }
        "401": { description: Missing or invalid user bearer }
        "409": { description: Epoch/cursor invalid; code snapshot_required requests a fresh snapshot }
  /health:
    get:
      summary: Liveness and immutable API source revision
      responses:
        "200":
          description: Process is up; source_revision is the compiled server SHA or unknown for unversioned builds.
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version, source_revision]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
                  source_revision: { type: string, pattern: "^([0-9a-f]{40}|unknown)$" }
  /ready:
    get:
      summary: Database ready
      responses:
        "200":
          description: Schema reachable
        "503":
          description: Database unavailable
  /auth/salt:
    get:
      summary: Read the password authentication salt without changing credentials
      security: []
      parameters:
        - { name: user, in: query, required: true, schema: { type: string, maxLength: 256 } }
        - { name: kind, in: query, schema: { type: string, enum: [user, admin], default: user } }
      responses:
        "200":
          description: Stored salt or the default for an unregistered identity; clients use the returned value for password hashing
          content:
            application/json:
              schema:
                type: object
                required: [salt]
                properties:
                  salt: { type: string }
        "400": { description: Invalid user }
        "503": { description: Database unavailable }
  /register:
    post:
      summary: Create account and session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, pass_hash]
              properties:
                user: { type: string }
                pass_hash: { type: string }
                salt: { type: string }
                device_name: { type: string }
      responses:
        "200": { description: Session issued }
        "409": { description: User exists }
  /login:
    post:
      summary: Password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, pass_hash]
              properties:
                user: { type: string }
                pass_hash: { type: string }
                device_name: { type: string }
      responses:
        "200": { description: Session issued }
        "401": { description: Bad credentials }
  /login/totp:
    post:
      summary: Complete TOTP login
      responses:
        "200": { description: Session issued }
        "401": { description: Bad TOTP }
  /forgot:
    post:
      summary: Start password reset
      responses:
        "200": { description: Accepted }
  /reset:
    post:
      summary: Finish password reset
      responses:
        "200": { description: Password updated }
  /push:
    post:
      summary: Push one ciphertext blob (v1)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Stored }
  /push/batch:
    post:
      summary: Push a v1 batch
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Replaced ids }
        "413": { description: Batch too large }
  /pull:
    get:
      summary: Pull blobs since a cursor (v1)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: since
          schema: { type: integer }
      responses:
        "200": { description: Blob page }
  /forget:
    post:
      summary: Tombstone one id
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: deleted true/false }
  /count:
    get:
      summary: Alive blob count
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Count }
  /max:
    get:
      summary: Max updated_at
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Timestamp }
  /sync/capabilities:
    get:
      summary: Sync protocol flags
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Capabilities }
  /v2/push/batch:
    post:
      summary: Sync v2 push with epoch
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Ack }
        "409": { description: Epoch conflict }
  /v2/pull:
    get:
      summary: Sync v2 incremental page
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: epoch
          required: true
          schema: { type: string }
        - in: query
          name: after
          required: true
          schema: { type: integer }
        - in: query
          name: until
          schema: { type: integer }
      responses:
        "200": { description: Page }
  /v2/snapshot:
    get:
      summary: Sync v2 snapshot page
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Page }
  /v2/conflicts/resolve:
    post:
      summary: Resolve sync conflicts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Applied }
  /v2/conflicts/resolutions:
    get:
      summary: List conflict resolutions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Page }
  /api/self/vault:
    get:
      summary: Read wrapped vault material
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Opaque recovery wrapper plus stable account_id and integer key_generation }
    post:
      summary: Write wrapped vault material
      description: Stores opaque vault versions 1 through 4 without changing password authentication or deriving client keys. Version 1 preserves legacy password and Account Secret factors; an explicit namespace migration can retain that version. If-None-Match '*' atomically creates only a missing vault; changed legacy upserts atomically invalidate passkeys and advance key_generation. An intentional same-URK rewrap must supply operation=rewrap_same_urk and the current expected_key_generation; this preserves passkeys. The server cannot compare opaque plaintext keys, so upgraded clients must use this operation only after unlocking the existing URK.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultUpdate' }
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string, enum: ['*'] }, description: Create only when no account vault exists }
      responses:
        "200": { description: Stored }
        "400": { description: Invalid vault fields, version, or unsupported condition }
        "412": { description: A vault already exists; its original key material was preserved }
  /api/self/vault/reset:
    post:
      summary: Atomically replace the URK recovery wrapper and revoke passkey wrappers
      description: Requires the existing vault fields and current expected_key_generation. Advances generation and deletes all registered passkey wrappers and pending ceremonies in the same transaction. Existing encrypted memories are not deleted. Password login is unchanged. Never use for a same-URK password rewrap.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/VaultUpdate' }
                - type: object
                  required: [expected_key_generation]
      responses:
        "200": { description: Vault replaced and passkeys invalidated }
        "400": { description: Missing or stale generation, invalid wrapper, or conflicting operation }
        "403": { description: Read-only session }
  /api/self/passkeys:
    get:
      summary: List this account's active passkey unlock credentials and feature configuration
      description: Requires a login bearer session; this feature does not provide passwordless account login. Disabled by default until the exact HTTPS Dashboard origin and matching RP ID are configured. No encrypted wrapper or private credential state is included in the list.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: enabled, credentials, and when enabled rp_id/origin; existing vaults also have account_id/key_generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyList' }
        "401": { description: Login required }
        "503": { description: Invalid configuration or unavailable database }
  /api/self/passkeys/register/start:
    post:
      summary: Start adding a passkey from an already unlocked browser vault
      description: A maximum of 20 credentials and 8 pending ceremonies per account. Registration requires user verification. The browser must preserve its unlocked URK and have PRF support. The server cannot verify possession of plaintext URK.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: WebAuthn creation options and a five-minute one-use ceremony ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        "400": { description: No initialized vault, invalid label, or credential/pending limit }
        "403": { description: Read-only session }
        "404": { description: Passkey feature disabled }
  /api/self/passkeys/register/finish:
    post:
      summary: Verify registration and issue the first PRF assertion challenge
      description: Consumes the registration ceremony. Verifies attestation, challenge, exact origin, RP ID, UV and unique credential ownership using webauthn-rs. The credential remains pending. The returned prf_salt is a public 32-byte base64url input for extensions.prf.eval.first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinish' }
      responses:
        "200":
          description: Fresh assertion ceremony with credential_id and prf_salt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        "400": { description: Verification failed, expired/replayed ceremony, or duplicate credential }
  /api/self/passkeys/register/test:
    post:
      summary: Verify first assertion and issue an independent PRF round-trip challenge
      description: Consumes the first assertion ceremony. The browser derives a wrapping key from its first PRF result, encrypts the existing URK, then obtains this independent second PRF result and successfully unwraps the candidate wrapper before committing. No PRF output is sent to the server.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinish' }
      responses:
        "200":
          description: New assertion challenge, same credential/salt/account/generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        "400": { description: Invalid signature, UV, account, session, origin, RP, generation, expiry, or replay }
  /api/self/passkeys/register/commit:
    post:
      summary: Verify second assertion and activate this credential's opaque URK wrapper
      description: Requires the second independent assertion and a browser-tested AES-256-GCM wrapper. Stores metadata, verified public key/counter and opaque wrapper atomically only if vault generation still matches. Does not modify the recovery wrapper. PRF output, plaintext URK, or derived wrapping keys are never accepted.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/PasskeyFinish' }
                - type: object
                  required: [wrapper]
                  properties:
                    wrapper: { $ref: '#/components/schemas/PasskeyWrapper' }
      responses:
        "200": { description: Activated; ok=true }
        "400": { description: Invalid ceremony/assertion/wrapper, duplicate credential, or changed generation }
  /api/self/passkeys/unlock/start:
    post:
      summary: Issue a fresh verified-unlock assertion for a selected credential
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeySelect' }
      responses:
        "200":
          description: Fresh assertion ceremony and public PRF input; no wrapper yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyCeremony' }
        "400": { description: Credential unavailable or belongs to another account/generation/configuration }
  /api/self/passkeys/unlock/finish:
    post:
      summary: Verify fresh assertion and return only the matching opaque wrapper
      description: One-use assertion bound to the authenticated account, login session, selected credential, generation and exact RP/origin. Requires UV, signature validation and monotonic nonzero counters. Browser uses its retained PRF output to decrypt locally.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinish' }
      responses:
        "200":
          description: Matching wrapper and credential/account/RP/generation/PRF-salt metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyUnlocked' }
        "400": { description: Assertion invalid, expired, replayed, revoked, wrong session/account, or stale generation }
  /api/self/passkeys/remove:
    post:
      summary: Remove one owned passkey wrapper and revoke pending ceremonies
      description: Leaves other registered credentials and the recovery wrapper unchanged. Removal does not delete a credential from its authenticator/provider.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeySelect' }
      responses:
        "200": { description: Removed; ok=true }
        "400": { description: Credential unavailable or not owned by the authenticated account }
        "403": { description: Read-only session }
components:
  schemas:
    VaultUpdate:
      type: object
      required: [kdf_salt, wrapped_urk, urk_nonce, version]
      properties:
        kdf_salt: { type: string, minLength: 16 }
        wrapped_urk: { type: string, minLength: 1 }
        urk_nonce: { type: string, minLength: 1 }
        version: { type: integer, minimum: 1, maximum: 4 }
        operation: { type: string, enum: [rewrap_same_urk] }
        expected_key_generation: { type: integer, minimum: 1, maximum: 9007199254740991 }
    PasskeySelect:
      type: object
      additionalProperties: false
      required: [credential_id]
      properties:
        credential_id: { type: string, description: Canonical unpadded base64url }
    PasskeyFinish:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id: { type: string, format: uuid }
        credential:
          type: object
          description: Manually serialized WebAuthn response (id/rawId/type/response/clientExtensionResults). Strip all PRF results; only optional clientExtensionResults.prf.enabled is accepted. Unknown top-level and response fields are rejected. Never send whole credential.toJSON() without stripping extensions.
        wrapper: { $ref: '#/components/schemas/PasskeyWrapper' }
    PasskeyWrapper:
      type: object
      additionalProperties: false
      required: [version, kdf, wrapped_urk, nonce]
      properties:
        version: { type: integer, enum: [1] }
        kdf: { type: string, enum: [webauthn-prf-hkdf-sha256-v1] }
        wrapped_urk: { type: string, description: Canonical unpadded base64url of 48 bytes (32-byte URK plus GCM tag) }
        nonce: { type: string, description: Canonical unpadded base64url of 12 fresh random bytes }
    PasskeyCeremony:
      type: object
      required: [ceremony_id, public_key, account_id, rp_id, key_generation]
      properties:
        ceremony_id: { type: string, format: uuid }
        public_key: { type: object, description: Standard WebAuthn publicKey options; binary fields use base64url in transport }
        account_id: { type: string, format: uuid }
        rp_id: { type: string }
        key_generation: { type: integer, minimum: 1, maximum: 9007199254740991 }
        credential_id: { type: string }
        prf_salt: { type: string, description: Canonical unpadded base64url public 32-byte PRF evaluation input }
    PasskeyUnlocked:
      type: object
      required: [wrapper, credential_id, account_id, rp_id, key_generation, prf_salt]
      properties:
        wrapper: { $ref: '#/components/schemas/PasskeyWrapper' }
        credential_id: { type: string }
        account_id: { type: string, format: uuid }
        rp_id: { type: string }
        key_generation: { type: integer }
        prf_salt: { type: string }
    PasskeyList:
      type: object
