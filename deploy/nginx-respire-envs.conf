# Respire production HTTPS hosts; deployment is manual.
# Website: rsrs.rs. User console: dash.rsrs.rs. Administration: admin.rsrs.rs.
# API: api.rsrs.rs. Production web listens on 8089; API listens on 8789.
# Development uses 8087/8787 and does not update this production configuration.
# Install certificates covering the respective hostnames before enabling nginx.
# Console API calls remain same-origin; no new cross-origin authentication is added.

server {
    listen 80;
    listen [::]:80;
    server_name rsrs.rs dash.rsrs.rs admin.rsrs.rs api.rsrs.rs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rsrs.rs;
    ssl_certificate /etc/nginx/ssl/rsrs.rs/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rsrs.rs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location ^~ /admin { return 302 https://admin.rsrs.rs$request_uri; }
    location ^~ /dashboard { return 302 https://dash.rsrs.rs$request_uri; }
    location / { proxy_pass http://127.0.0.1:8089; include /etc/nginx/respire-proxy.inc; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dash.rsrs.rs;
    ssl_certificate /etc/nginx/ssl/dash.rsrs.rs/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dash.rsrs.rs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location = / { return 302 /dashboard; }
    # The user console must never proxy administrator routes.
    location ^~ /admin { return 404; }
    location /dashboard { proxy_pass http://127.0.0.1:8089; include /etc/nginx/respire-proxy.inc; }
    location / { proxy_pass http://127.0.0.1:8789; include /etc/nginx/respire-proxy.inc; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.rsrs.rs;
    ssl_certificate /etc/nginx/ssl/admin.rsrs.rs/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.rsrs.rs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location = / { return 302 /admin; }
    location = /admin { proxy_pass http://127.0.0.1:8089; include /etc/nginx/respire-proxy.inc; }
    location /admin/ { proxy_pass http://127.0.0.1:8789; include /etc/nginx/respire-proxy.inc; }
    location / { proxy_pass http://127.0.0.1:8789; include /etc/nginx/respire-proxy.inc; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.rsrs.rs;
    ssl_certificate /etc/nginx/ssl/api.rsrs.rs/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.rsrs.rs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;

    location / { proxy_pass http://127.0.0.1:8789; include /etc/nginx/respire-proxy.inc; }
}
